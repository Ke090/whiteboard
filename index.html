<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f7f8fa">
    <title>ホワイトボード</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="toolbar" aria-label="描画ツール">
      <div class="toolbar__row">
        <button id="penButton" class="tool-button is-active" type="button" aria-pressed="true">✎ ペン</button>
        <button id="eraserButton" class="tool-button" type="button" aria-pressed="false">消しゴム</button>
        <span class="separator" aria-hidden="true"></span>
        <button id="undoButton" class="icon-button" type="button" aria-label="戻す" disabled>↶</button>
        <button id="redoButton" class="icon-button" type="button" aria-label="進む" disabled>↷</button>
        <button id="clearButton" class="icon-button danger" type="button" aria-label="全消去">全消去</button>
      </div>
      <div class="toolbar__row settings-row">
        <label class="color-control" aria-label="ペンの色">
          <span>色</span>
          <input id="colorInput" type="color" value="#1f2937">
        </label>
        <label class="size-control" for="sizeInput">
          <span>太さ</span>
          <input id="sizeInput" type="range" min="2" max="32" value="6">
          <output id="sizeOutput" for="sizeInput">6</output>
        </label>
      </div>
    </header>
    <main class="board-wrap">
      <canvas id="board" aria-label="描画エリア"></canvas>
    </main>
    <div id="saveStatus" class="save-status" role="status" aria-live="polite">端末に自動保存</div>
    <script src="app.js"></script>
  </body>
</html>
